plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.ixxgal.musicdesk'
    compileSdk 34

    defaultConfig {
        applicationId "com.ixxgal.musicdesk"
        minSdk 24
        targetSdk 34
        versionCode 10
        versionName "1.2.3"

        // Chaquopy 要求显式声明 ABI。只留 arm64：现在手机基本都是这个，
        // 而且 Python 运行时每多一个 ABI 就多十几 MB。
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        debug {
            // 用 Android 工具链自己的调试签名，装得上、能直接 sideload
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

chaquopy {
    defaultConfig {
        // 本机 build 用的 Python 是 3.12，两边要一致
        version = "3.12"
        buildPython "C:/Users/xxgA/AppData/Local/Programs/Python/Python312/python.exe"
        pyc {
            src = false  // 源码直接进 APK，方便线上排查
        }
    }
    // 先只装纯 Python、无 C 扩展的包，验证链路能不能通
    productFlavors {
    }
}